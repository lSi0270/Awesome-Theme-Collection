# Erstellt mit HATG v1.3.2
# Theme: Awesome-Leather-Shadows-UIX (v1.0.2 by lSi) – Grundfarbe #0A5CFF, Akzent #BA4B00, Karten-Radius 10px
# Generiert am 2026-10-12

Awesome-Leather-Shadows-UIX:
  # UIX (theme-global; muss auf Theme-Ebene stehen, nicht unter modes.light/dark)
  uix-card: |
    /* HATG:UIX:eigene-3d-hintergrund-mit-abgesetzten-rand:START */
    :host(:not(hui-heading-card):not(hui-markdown-card):not(advanced-camera-card):not(mushroom-chips-card):not(mushroom-title-card)) ha-card {
      background: var(--custom-card-gradient) !important;
      box-shadow: var(--custom-card-shadows) !important;
      border: var(--custom-card-border) !important;
    }
    :host([class*="bubble-"]:not([class*="pop-up"])) {
      --bubble-main-background-color: transparent !important;
      --bubble-button-background-color: transparent !important;
      --bubble-climate-background-color: transparent !important;
    }
    :host([class*="bubble-"]:not([class*="pop-up"])) ha-card,
    :host([class*="bubble-"]) .bubble-container,
    :host([class*="bubble-"]) .bubble-climate-container,
    :host([class*="bubble-"]) .bubble-climate-card,
    :host([class*="bubble-"]) .bubble-button-card-container,
    :host([class*="bubble-"]) .bubble-close-button,
    :host([class*="bubble-"]) .bubble-card-background {
      background: var(--custom-card-gradient) !important;
      box-shadow: var(--custom-card-shadows) !important;
      border: var(--custom-card-border) !important;
    }
    :host([class*="bubble-"]):has(.bubble-separator) ha-card,
    :host([class*="bubble-"]):has(.bubble-empty-column) ha-card,
    :host([class*="bubble-"]) .bubble-separator,
    :host([class*="bubble-"]) .bubble-empty-column,
    .bubble-separator, .bubble-empty-column,
    ha-md-list {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    :host(.type-heading),
    :host([data-type="heading"]),
    ha-card.type-heading {
      --heading-card-title-color: var(--heading-text-color) !important;
      --heading-card-subtitle-color: var(--heading-text-color) !important;
      --primary-text-color: var(--heading-text-color) !important;
      color: var(--heading-text-color) !important;
    }
    ha-card.type-heading .title,
    ha-card.type-heading .subtitle {
    color: var(--heading-text-color) !important;
    }
    /* HATG:UIX:eigene-3d-hintergrund-mit-abgesetzten-rand:END */
    /* HATG:UIX:eigene-popup-hintergrund-fuer-bubble-card-popups:START */
    .bubble-pop-up-background {
      background: var(--popup-custom-wallpaper, var(--lovelace-background, none)) !important;
      background-attachment: scroll !important;
      box-shadow: var(--custom-card-shadows) !important;
      border: var(--custom-card-border) !important;
    }
    .bubble-pop-up-header, .bubble-header, .bubble-header-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .bubble-header {
      .bubble-name {
        font-size: var(--ha-font-size-xl) !important;
        line-height: 22px !important;
        color: var(--heading-text-color) !important;
      }
      .bubble-main-icon {
        color: var(--heading-text-color) !important;
      }
    }
    /* HATG:UIX:eigene-popup-hintergrund-fuer-bubble-card-popups:END */
  uix-root: |
    /* HATG:UIX:eigene-toolbar-mit-schatten:START */
    div div.header slot div.toolbar {
      box-shadow:
        var(--custom-toolbar-shadow, no) !important;
        z-index: 10 !important;
    }
    /* HATG:UIX:eigene-toolbar-mit-schatten:END */
  uix-badge: |
    /* HATG:UIX:eigene-3d-hintergrund-fuer-die-badges:START */
    :host {
      --ha-card-background: var(--custom-card-gradient) !important;
      --ha-card-box-shadow: var(--custom-card-shadows) !important;
    }
    /* HATG:UIX:eigene-3d-hintergrund-fuer-die-badges:END */
  uix-sidebar: |
    /* HATG:UIX:eigene-sidebar-eintrag-hervorheben:START */
    ha-list-item-button.selected::before {
      box-shadow:
        inset 3px 3px 7px color-mix(in srgb, var(--accent-color, var(--primary-color)), #000000), inset -2px -2px 6px color-mix(in srgb, var(--accent-color, var(--primary-color)) 74%, #ffffff) !important;
      }
    ha-list-item-button.selected::before {
      border-radius: var(--ha-card-border-radius, 14px) !important;
      opacity: 1 !important;
      background-color: var(--accent-color, var(--primary-color)) !important;
      background-image: none !important;
    }
    ha-list-item-button.selected {
      --sidebar-selected-text-color: var(--disabled-color);
      --sidebar-selected-icon-color: var(--disabled-color);
      color: var(--text-primary-color) !important;
    }
    ha-list-item-button::before {
      transition: opacity 160ms ease, box-shadow 160ms ease;
    }
    :host {
      box-shadow:
        var(--custom-sidebar-shadow, no) !important;
        z-index: 10 !important;
      backdrop-filter: blur(1px) !important;
    }
    .badge {
      background-color: var(--accent-color) !important;
      color: var(--disabled-color) !important;
      font-weight: bold !important;
      border: 1px solid black !important;
    }
    /* HATG:UIX:eigene-sidebar-eintrag-hervorheben:END */
  uix-drawer: |
    /* HATG:UIX:eigene-dashboard-hintergrund-fuer-alle-seiten:START */
    :host {
      background: transparent !important;
      --primary-background-color: transparent !important;
      --data-table-background-color: transparent !important;
    }
    :host::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: var(--lovelace-background, transparent) !important;
      background-attachment: scroll !important;
      will-change: transform;
    }
    /* HATG:UIX:eigene-dashboard-hintergrund-fuer-alle-seiten:END */
  uix-more-info-yaml: |
    # HATG:UIX:eigene-popup-hintergrund-fuer-more-info:START
    "$ ha-dialog $": |
      wa-dialog::part(dialog) {
        background: var(--popup-custom-wallpaper, var(--lovelace-background, none)) !important;
        background-attachment: scroll !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
      }
    "$ ha-bottom-sheet $ wa-drawer#drawer $": |
      dialog.drawer {
        background: var(--popup-custom-wallpaper, var(--lovelace-background, none)) !important;
        background-attachment: scroll !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
        overflow: hidden !important;
        border-radius: 18px 18px 0px 0px !important;
      }
      panel, .body, .container, :host {
        background: transparent !important;
        background-color: transparent !important;
      }
    # HATG:UIX:eigene-popup-hintergrund-fuer-more-info:END
  uix-dialog-yaml: |
    # HATG:UIX:eigene-popup-hintergrund-fuer-alle-dialoge:START
    "$ ha-dialog $ wa-dialog $": |
      dialog.dialog {
        background: var(--popup-custom-wallpaper, var(--lovelace-background, none)) !important;
        background-attachment: scroll !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
      }
    "$ ha-bottom-sheet $ wa-drawer#drawer $": |
      dialog.drawer {
        background: var(--popup-custom-wallpaper, var(--lovelace-background, none)) !important;
        background-attachment: scroll !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
        overflow: hidden !important;
        border-radius: 18px 18px 0px 0px !important;
      }
      panel, .body, .container, :host {
        background: transparent !important;
        background-color: transparent !important;
      }
    $: |
      :host(.type-dialog-lovelace-dashboard-detail),
      :host(.type-hui-dialog-create-card),
      :host(.type-dialog-edit-badge),
      :host(.type-dialog-edit-card) {
        wa-dialog::part(dialog) {
          background: var(--popup-custom-wallpaper, var(--lovelace-background, none)) !important;
          background-attachment: scroll !important;
          box-shadow: var(--custom-card-shadows) !important;
          border: var(--custom-card-border) !important;
        }
      }
    ".": |
      div.dialog-content div.calendar-item {
        background: var(--custom-card-gradient) !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
      }
    # HATG:UIX:eigene-popup-hintergrund-fuer-alle-dialoge:END
  uix-config-yaml: |
    # HATG:UIX:eigene-karten-auf-einstellungsseiten-mit-fuellung:START
    ".": |
      :host {
        --ha-card-background: var(--custom-card-gradient) !important;
        --ha-card-box-shadow: var(--custom-card-shadows) !important;
        --ha-card-border: var(--custom-card-border) !important;
        --data-table-background-color: transparent !important;
      }
    # HATG:UIX:eigene-karten-auf-einstellungsseiten-mit-fuellung:END
  uix-toast-yaml: |
    # HATG:UIX:eigene-toast-meldungen-mit-fuellung-und-leuchtrand:START
    $: |
      :host {
        --ha-color-neutral-10: transparent !important;
        --ha-color-on-neutral-loud: var(--primary-text-color);
        --ha-border-radius-sm: var(--ha-card-border-radius, 14px);
        --wa-shadow-l: var(--custom-card-shadows);
      }
      div.toast {
        background:
          var(--custom-card-gradient),
          var(--card-background-color) !important;
          border: var(--custom-glow-border) !important;
      }
    # HATG:UIX:eigene-toast-meldungen-mit-fuellung-und-leuchtrand:END
  uix-profile-yaml: |
    # HATG:UIX:eigene-karten-der-profileseiten-mit-fuellung:START
    "ha-profile-section-general $": |
      hass-tabs-subpage div.content ha-card {
        background: var(--custom-card-gradient) !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
      }
    "ha-profile-section-security $ ha-change-password-card $": |
      ha-card {
        background: var(--custom-card-gradient) !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
      }
    "ha-profile-section-security $ ha-mfa-modules-card $": |
      ha-card {
        background: var(--custom-card-gradient) !important;
        box-shadow: var(--custom-card-shadows) !important;
        border: var(--custom-card-border) !important;
      }
        "ha-profile-section-security $ ha-refresh-tokens-card $": |
          ha-card {
            background: var(--custom-card-gradient) !important;
            box-shadow: var(--custom-card-shadows) !important;
            border: var(--custom-card-border) !important;
          }
        "ha-profile-section-security $ ha-long-lived-access-tokens-card $": |
          ha-card {
            background: var(--custom-card-gradient) !important;
            box-shadow: var(--custom-card-shadows) !important;
            border: var(--custom-card-border) !important;
          }
    # HATG:UIX:eigene-karten-der-profileseiten-mit-fuellung:END
  uix-theme: "Awesome-Leather-Shadows-UIX"
  uix-hacs-frontend-yaml: |
    # HATG:UIX:eigene-hacs-frontend-mit-hintergrund:START
    ".": |
      :host {
        --data-table-background-color: transparent !important;
      }
    hacs-dashboard $ hass-tabs-subpage-data-table $ hass-tabs-subpage $: |
      :host {
        background: var(--lovelace-background, transparent) !important;
      }
    hacs-repository-dashboard $:
      hass-subpage $: |
        :host {
          background: var(--lovelace-background, transparent) !important;
        }
      hass-loading-screen $: |
        :host {
          background: var(--lovelace-background, transparent) !important;
        }
    # HATG:UIX:eigene-hacs-frontend-mit-hintergrund:END
  uix-knx-frontend-yaml: |
    # HATG:UIX:eigene-knx-frontend-mit-hintergrund:START
    knx-dashboard $ hass-subpage $: |
      :host {
        background: var(--lovelace-background, transparent) !important;
      }
    # HATG:UIX:eigene-knx-frontend-mit-hintergrund:END
